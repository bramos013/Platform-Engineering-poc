apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: platform-poc

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: poc-backend:1.0

        imagePullPolicy: Never

        ports:
        - containerPort: 3000